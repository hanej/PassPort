name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag push is a real release. A manual run is a rehearsal: it publishes a draft
  # under a throwaway name, and GitHub does not create a git tag for a draft, so
  # deleting the draft is full cleanup.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      rpm_version: ${{ steps.resolve.outputs.rpm_version }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - name: Resolve release identity
        id: resolve
        # GITHUB_REF_TYPE and GITHUB_REF_NAME are default environment variables, so
        # nothing is interpolated into this script.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            rpm_version="${tag#v}"
            draft=false
          else
            # An RPM version may not contain a dash, so a rehearsal cannot reuse the tag.
            tag="rehearsal-$GITHUB_RUN_ID"
            rpm_version="0.0.0"
            draft=true
          fi
          {
            echo "tag=$tag"
            echo "rpm_version=$rpm_version"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            extension: .exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.meta.outputs.tag }}
          OUTPUT: bin/passport-${{ matrix.suffix }}${{ matrix.extension }}
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${OUTPUT}" \
            ./cmd/passport

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passport-${{ matrix.suffix }}${{ matrix.extension }}
          path: bin/passport-${{ matrix.suffix }}${{ matrix.extension }}

  rpm:
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      matrix:
        include:
          - goarch: amd64
            nfpm_arch: amd64
          - goarch: arm64
            nfpm_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o bin/passport \
            ./cmd/passport

      - name: Build RPM
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.meta.outputs.rpm_version }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
        run: |
          mkdir -p dist
          nfpm pkg \
            --packager rpm \
            --config nfpm.yaml \
            --target dist/
          # Embed the arch in the filename for clarity
          for f in dist/*.rpm; do
            mv "$f" "${f%.rpm}-${NFPM_ARCH}.rpm"
          done

      - name: Upload RPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-${{ matrix.nfpm_arch }}
          path: dist/*.rpm

  release:
    runs-on: ubuntu-latest
    needs: [meta, build, rpm]
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          # Take the section for this tag, from its heading up to the next one.
          awk -v heading="## [$TAG]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          # Drop the horizontal rule the file uses to separate releases.
          perl -0pi -e 's/\n+---\s*\z/\n/' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for $TAG; using a pointer to the file instead." >&2
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for the full history.\n' \
              "$GITHUB_REPOSITORY" > release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          draft: ${{ needs.meta.outputs.draft }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
