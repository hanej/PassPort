{{define "password_rules"}}
{{if .}}
<div class="password-rules mb-3"
     data-min-length="{{.MinLength}}"
     data-complexity="{{if .ComplexityEnabled}}1{{else}}0{{end}}"
     data-account-name="{{.SamAccountName}}"
     data-display-name="{{.DisplayName}}">
    <p class="small text-muted mb-1">Your organization requires:</p>
    <ul class="list-unstyled small mb-0">
        <li class="password-rule" data-rule="length">
            <i class="bi bi-circle me-1"></i>At least {{.MinLength}} characters
        </li>
        {{if .ComplexityEnabled}}
        <li class="password-rule" data-rule="categories">
            <i class="bi bi-circle me-1"></i>Three of: uppercase, lowercase, number, symbol
        </li>
        <li class="password-rule" data-rule="name">
            <i class="bi bi-circle me-1"></i>Must not contain your name or username
        </li>
        {{end}}
    </ul>
</div>
{{end}}
{{end}}
